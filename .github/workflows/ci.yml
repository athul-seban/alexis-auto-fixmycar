name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Pushes the schema to an isolated sqlite file (see vitest.global-setup.ts) and runs the suite.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Browser tests (desktop + mobile) against the dev server and the seeded demo data.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./e2e.db"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The same unit/route tests against Postgres (the production database) with the production schema.
  # Non-blocking until it has been seen green once: SQLite and Postgres differ in small ways (case-insensitive
  # LIKE, ordering of ties) and this job exists to surface exactly those.
  postgres:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qmg
          POSTGRES_PASSWORD: qmg
          POSTGRES_DB: qmg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qmg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://qmg:qmg@localhost:5432/qmg_test"
      TEST_DATABASE_URL: "postgresql://qmg:qmg@localhost:5432/qmg_test"
      PRISMA_SCHEMA: "prisma/schema.prod.prisma"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client (production schema)
        run: npx prisma generate --schema=prisma/schema.prod.prisma

      - name: Test against Postgres
        run: npx vitest run --project node
