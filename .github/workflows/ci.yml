name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      # Both schema files must be valid (the production one is what `prisma db push` applies to Postgres) and identical in
      # content: src/lib/schema-parity.test.ts, run below, enforces that.
      - name: Validate Prisma schemas
        run: |
          npx prisma validate
          DATABASE_URL="postgresql://u:p@localhost:5432/x" npx prisma validate --schema=prisma/schema.prod.prisma

      # Known-vulnerable runtime dependencies fail the build. (Dev tooling is excluded: it never ships.)
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # Pushes the schema to an isolated sqlite file (see vitest.global-setup.ts) and runs the suite. SQLite allows one
      # writer at a time, and on a 2-core runner dozens of parallel files just queue behind each other until tests time
      # out, so files run one at a time here (Postgres, below, has row locks and runs them in parallel).
      - name: Test
        run: npm test -- --no-file-parallelism

      - name: Build
        run: npm run build

  # A pull request may only change the production schema additively: the database is real and is changed with
  # `prisma db push`, so a dropped column or a changed type would lose data. See scripts/schema-safety.mjs.
  schema-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compare the production schema with the base branch
        run: node scripts/schema-safety.mjs "origin/${{ github.base_ref }}"

  # Browser tests (desktop + mobile) against the dev server and the seeded demo data.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./e2e.db"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The same unit/route tests against Postgres (the production database) with the production schema.
  # Non-blocking until it has been seen green once: SQLite and Postgres differ in small ways (case-insensitive
  # LIKE, ordering of ties) and this job exists to surface exactly those.
  postgres:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qmg
          POSTGRES_PASSWORD: qmg
          POSTGRES_DB: qmg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qmg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://qmg:qmg@localhost:5432/qmg_test"
      TEST_DATABASE_URL: "postgresql://qmg:qmg@localhost:5432/qmg_test"
      PRISMA_SCHEMA: "prisma/schema.prod.prisma"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client (production schema)
        run: npx prisma generate --schema=prisma/schema.prod.prisma

      - name: Test against Postgres
        run: npx vitest run --project node
