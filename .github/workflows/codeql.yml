name: CodeQL

# Static analysis for the security bugs a type-checker can't see (injection, unsafe redirects, secrets in code). Results appear
# under the repository's Security tab. Weekly too, so a newly published query is run against code that hasn't changed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
